<script>
    // Переключение контента по меню
    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            
            // Убираем активный класс у всех кнопок
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            // Добавляем активный класс текущей кнопке
            this.classList.add('active');
            
            const contentType = this.getAttribute('data-content');
            
            // Скрываем все секции контента
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Показываем нужную секцию
            document.getElementById(contentType + 'Content').classList.add('active');
            
            // Показываем/скрываем блок услуг (только на главной)
            const servicesBlock = document.getElementById('servicesBlock');
            if (contentType === 'main') {
                servicesBlock.style.display = 'block';
            } else {
                servicesBlock.style.display = 'none';
            }
        });
    });

    // JavaScript для мобильного меню
    const menuToggle = document.getElementById('menuToggle');
    const nav = document.getElementById('mainNav');
    let autoShowExecuted = false;

    function toggleMenu() {
        nav.classList.toggle('nav-active');
    }

    menuToggle.addEventListener('click', function() {
        toggleMenu();
        autoShowExecuted = true;
    });

    function autoShowMenu() {
        if (window.innerWidth <= 768 && !autoShowExecuted && !nav.classList.contains('nav-active')) {
            setTimeout(function() {
                if (!nav.classList.contains('nav-active') && !autoShowExecuted) {
                    nav.classList.add('nav-active');
                    autoShowExecuted = true;
                }
            }, 5000);
        }
    }

    // Слайдер для героя - 15 ФОТО
    const heroPhotos = [
        'icon/hero/mobile/Photo1.jpg',
        'icon/hero/mobile/Photo2.jpg', 
        'icon/hero/mobile/Photo3.jpg',
        'icon/hero/mobile/Photo4.jpg',
        'icon/hero/mobile/Photo5.jpg',
        'icon/hero/mobile/Photo6.jpg',
        'icon/hero/mobile/Photo7.jpg',
        'icon/hero/mobile/Photo8.jpg',
        'icon/hero/mobile/Photo9.jpg',
        'icon/hero/mobile/Photo10.jpg',
        'icon/hero/mobile/Photo11.jpg',
        'icon/hero/mobile/Photo12.jpg',
        'icon/hero/mobile/Photo13.jpg',
        'icon/hero/mobile/Photo14.jpg',
        'icon/hero/mobile/Photo15.jpg'
    ];
    
    let currentSlide = 0;
    let slideInterval;
    let startX = 0;
    let endX = 0;
    
    function initSlider() {
        const slider = document.getElementById('heroSlider');
        const heroContent = document.querySelector('.hero-content');
        
        // Создаем слайды
        heroPhotos.forEach((photo, index) => {
            const img = new Image();
            img.src = photo;
            img.alt = `Салон красоты Пузырьки ${index + 1}`;
            img.onerror = function() {
                console.error('Ошибка загрузки фото:', photo);
            };
            if (index === 0) {
                img.classList.add('active');
                heroContent.style.display = 'block';
            }
            slider.appendChild(img);
        });
        
        // Добавляем обработчики свайпа
        addSwipeListeners();
        
        // Автопереключение
        startAutoSlide();
    }
    
    // Функции для свайпа
    function addSwipeListeners() {
        const slider = document.getElementById('heroSlider');
        
        slider.addEventListener('touchstart', handleTouchStart, false);
        slider.addEventListener('touchmove', handleTouchMove, false);
        slider.addEventListener('touchend', handleTouchEnd, false);
    }
    
    function handleTouchStart(evt) {
        startX = evt.touches[0].clientX;
    }
    
    function handleTouchMove(evt) {
        endX = evt.touches[0].clientX;
    }
    
    function handleTouchEnd() {
        if (startX - endX > 50) {
            // Свайп влево - следующий слайд
            nextSlide();
        } else if (endX - startX > 50) {
            // Свайп вправо - предыдущий слайд
            prevSlide();
        }
        resetAutoSlide();
    }
    
    function goToSlide(index) {
        const heroContent = document.querySelector('.hero-content');
        currentSlide = index;
        updateSlider();
        resetAutoSlide();
        
        // Показываем надписи только на первом слайде
        if (index === 0) {
            heroContent.style.display = 'block';
        } else {
            heroContent.style.display = 'none';
        }
    }
    
    function updateSlider() {
        const slides = document.querySelectorAll('.hero-slider img');
        
        slides.forEach((slide, index) => {
            slide.classList.toggle('active', index === currentSlide);
        });
    }
    
    function nextSlide() {
        const heroContent = document.querySelector('.hero-content');
        currentSlide = (currentSlide + 1) % heroPhotos.length;
        updateSlider();
        
        // Показываем надписи только на первом слайде
        if (currentSlide === 0) {
            heroContent.style.display = 'block';
        } else {
            heroContent.style.display = 'none';
        }
    }
    
    function prevSlide() {
        const heroContent = document.querySelector('.hero-content');
        currentSlide = (currentSlide - 1 + heroPhotos.length) % heroPhotos.length;
        updateSlider();
        
        // Показываем надписи только на первом слайде
        if (currentSlide === 0) {
            heroContent.style.display = 'block';
        } else {
            heroContent.style.display = 'none';
        }
    }
    
    function startAutoSlide() {
        slideInterval = setInterval(nextSlide, 10000);
    }
    
    function resetAutoSlide() {
        clearInterval(slideInterval);
        startAutoSlide();
    }
    
    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', function() {
        autoShowMenu();
        initSlider();
    });
    
    window.addEventListener('resize', autoShowMenu);
</script>
